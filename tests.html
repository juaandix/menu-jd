<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests · Menú JD</title>
  <style>
    body{font-family:ui-monospace,Menlo,monospace;background:#0d1b2e;color:#e8eef9;margin:0;padding:16px;font-size:13px}
    .ok{color:#6fc493} .ko{color:#e2704b;font-weight:700} h1{font-size:16px}
    iframe{display:none}
  </style>
</head>
<body>
  <h1 id="head">Ejecutando tests…</h1>
  <pre id="out"></pre>
  <!-- Abre http://localhost:8080/tests.html con el servidor de pruebas. Carga la app en un iframe y prueba sus
       funciones puras (no escribe en el registro; lo que toca de localStorage lo deja como estaba). -->
  <iframe id="app" src="index.html"></iframe>
<script>
"use strict";
const lines = [];
let pass = 0, fail = 0;
function t(name, fn) {
  try { const r = fn(); if (r === false) throw new Error("falso"); pass++; lines.push(`<span class="ok">✓</span> ${name}`); }
  catch (e) { fail++; lines.push(`<span class="ko">✗ ${name}</span>\n    ${String(e.message || e).replace(/</g, "&lt;")}`); }
}
async function ta(name, fn) {
  try { const r = await fn(); if (r === false) throw new Error("falso"); pass++; lines.push(`<span class="ok">✓</span> ${name}`); }
  catch (e) { fail++; lines.push(`<span class="ko">✗ ${name}</span>\n    ${String(e.message || e).replace(/</g, "&lt;")}`); }
}
function eq(a, b, msg = "") { if (a !== b) throw new Error(`${msg} esperaba ${JSON.stringify(b)}, salió ${JSON.stringify(a)}`); }
function near(a, b, tol, msg = "") { if (!(Math.abs(a - b) <= tol)) throw new Error(`${msg} esperaba ${b} ±${tol}, salió ${a}`); }

let swText = "";
fetch("sw.js", { cache: "no-store" }).then((r) => r.text()).then((x) => (swText = x)).catch(() => {});
document.getElementById("app").addEventListener("load", () => setTimeout(() => run().catch((e) => { document.getElementById("head").textContent = "Error: " + e.message; }), 300));
async function run() {
  const w = document.getElementById("app").contentWindow;
  const E = (code) => w.eval(code); // ámbito global de la app (llega a const/let como SHOP o profile)
  const SHOP = E("SHOP"), PROFILES = E("PROFILES"), ROLE_LABELS = E("ROLE_LABELS");
  // Que nada de lo guardado en este navegador (Mis productos, lo que falta) cambie los resultados.
  const saved = {};
  for (const k of ["menujd.products.v1", "menujd.missing.v1"]) { saved[k] = w.localStorage.getItem(k); w.localStorage.removeItem(k); }
  E("parseCache.clear()");
  const withProfile = (id, fn) => {
    const prev = E("profile.id");
    E(`profile = PROFILES.${id}; rebuildIndex();`);
    try { return fn(); } finally { E(`profile = PROFILES.${prev}; rebuildIndex();`); }
  };

  /* despliegue */
  t("sw.js tiene contenido y su CACHE coincide con APP_VERSION", () => {
    if (!swText.includes("addEventListener(\"fetch\"") && !swText.includes("addEventListener('fetch'")) throw new Error("sw.js vacío o sin manejador fetch");
    const v = E("APP_VERSION");
    if (!swText.includes(`"menujd-${v}"`)) throw new Error(`sw.js no tiene "menujd-${v}"`);
  });

  /* catálogo */
  t("Cada entrada del catálogo tiene un grupo válido (r)", () => {
    const bad = SHOP.filter((c) => !c.r || !ROLE_LABELS[c.r.split(":")[0]]).map((c) => c.key);
    eq(bad.length, 0, "sin grupo: " + bad.join(", "));
  });
  t("Ida y vuelta: el texto de sustituto (w) vuelve a caer en la misma entrada", () => {
    const bad = [];
    for (const c of SHOP) {
      if (c.w && w.parseIng(`100 g de ${c.w}`).c?.key !== c.key) bad.push(c.key);
      if (c.cooked && c.cooked.w) { const r = w.parseIng(`100 g de ${c.cooked.w}`); if (r.c?.key !== c.key || !r.cooked) bad.push(c.key + " (cocido)"); }
    }
    eq(bad.length, 0, "fallan: " + bad.join(", "));
  });
  t("Todos los ingredientes de los platos de JD caen en el catálogo o son verduras libres", () => {
    const bad = withProfile("jd", () => E("ALL").flatMap((o) => o.i.filter((raw) => !w.parseIng(raw).c).map((raw) => `${o.id}: ${raw}`)));
    if (bad.length) console.info("Sin entrada en el catálogo:", bad);
    return true; // informativo: las verduras libres y "al gusto" no tienen entrada
  });

  /* platos de JD: regla del intercambio */
  t("Platos de JD dentro de su franja (±15 kcal, ±3 g P; snacks 13–21 g P)", () => {
    const bad = [];
    withProfile("jd", () => {
      const prof = E("profile");
      for (const s of prof.slots) for (const o of E(`profile._baseMenu["${s.id}"]`)) {
        const tg = s.target; if (!tg) continue;
        const okK = Math.abs(o.k - tg.k) <= 15;
        const okP = tg.p != null ? Math.abs(o.p - tg.p) <= 3 : o.p >= tg.pMin && o.p <= tg.pMax;
        if (!okK || !okP) bad.push(`${o.id} ${o.k} kcal ${o.p} g P`);
      }
    });
    eq(bad.length, 0, bad.join("; "));
  });
  t("Macros de los platos de JD = suma de sus ingredientes (±3 %)", () => {
    const bad = [];
    withProfile("jd", () => {
      for (const o of E("profile._baseMenu ? Object.values(profile._baseMenu).flat() : ALL")) {
        const sum = o.i.reduce((a, raw) => a + ((w.ingMacros(raw) || {}).k || 0), 0);
        if (Math.abs(sum - o.k) > o.k * 0.03) bad.push(`${o.id}: plato ${o.k}, ingredientes ${Math.round(sum)}`);
      }
    });
    eq(bad.length, 0, bad.join("; "));
  });

  /* gramos del sustituto */
  t("fitGramsFor 'k' iguala las kcal", () => {
    const o = { k: 247.5, p: 46.5, c: 0, f: 5.4 };
    const g = w.fitGramsFor(o, [100, 23, 0, 1], "k");
    near(g, 248, 1);
  });
  t("fitGramsFor 'auto' queda entre igualar kcal e igualar proteína", () => {
    const o = { k: 247.5, p: 46.5, c: 0, f: 5.4 }, nut = [100, 23, 0, 1];
    const g = w.fitGramsFor(o, nut, "auto"), gk = w.fitGramsFor(o, nut, "k"), gp = w.fitGramsFor(o, nut, "p");
    return g <= Math.max(gk, gp) && g >= Math.min(gk, gp);
  });
  t("fitGramsFor devuelve 0 si el nuevo no tiene de ese macro", () => eq(w.fitGramsFor({ k: 100, p: 10, c: 0, f: 0 }, [100, 23, 0, 1], "c"), 0));
  t("En ingredientes sin apenas proteína (arroz) se igualan las kcal", () => eq(w.defaultFit(w.ingMacros("200 g de arroz cocido")), "k"));

  /* sustitutos recomendados */
  const subs = (raw) => w.substitutes(raw).map((r) => r.opt.c.key);
  t("Pollo cocido → recomienda pavo fresco entre los 3 primeros", () => { const s = subs("150 g de pollo cocido"); if (!s.slice(0, 3).includes("pavofresco")) throw new Error(s.join(", ")); });
  t("Arroz cocido → recomienda pasta entre los 3 primeros", () => { const s = subs("200 g de arroz cocido"); if (!s.slice(0, 3).includes("pasta")) throw new Error(s.join(", ")); });
  t("Aceite → solo grasas", () => { const s = w.substitutes("10 g de aceite de oliva"); return s.length > 0 && s.every((r) => r.opt.c.r.startsWith("grasa")); });
  t("Nunca recomienda el mismo ingrediente ni salsas para algo que no es salsa", () => {
    for (const raw of ["150 g de pollo cocido", "200 g de arroz cocido", "100 g de queso batido 0%", "1 plátano", "45 g de avena molida"]) {
      const old = w.parseIng(raw).c.key;
      for (const r of w.substitutes(raw)) {
        if (r.opt.c.key === old) throw new Error(`${raw} → sí mismo`);
        if ((r.opt.c.r || "").startsWith("salsa")) throw new Error(`${raw} → ${r.opt.c.key}`);
      }
    }
  });
  t("Lo que te falta no sale como sustituto", () => {
    w.localStorage.setItem("menujd.missing.v1", JSON.stringify(["pavofresco"]));
    try { return !subs("150 g de pollo cocido").includes("pavofresco"); }
    finally { w.localStorage.removeItem("menujd.missing.v1"); }
  });
  t("dishMissing marca los platos que llevan algo que falta", () => {
    w.localStorage.setItem("menujd.missing.v1", JSON.stringify(["pollo"]));
    try {
      return withProfile("jd", () => {
        const all = E("ALL"), hit = all.filter((o) => w.dishMissing(o).length);
        return hit.length > 0 && hit.every((o) => o.i.some((raw) => w.parseIng(raw).c?.key === "pollo"));
      });
    } finally { w.localStorage.removeItem("menujd.missing.v1"); }
  });

  /* plan de Cristina */
  t("Plan de Cristina: cada día de S1 y S2 tiene sus 5 comidas", () => {
    withProfile("cristina", () => {
      eq(w.planWeeks().join(","), "S1,S2", "semanas");
      for (const wk of ["s1", "s2"]) for (let i = 0; i < 7; i++) {
        const d = new Date(2026, 9, 11 + i, 12); // domingo 11/10/2026 → sábado
        const n = w.planDishes(wk, d).length;
        if (n !== 5) throw new Error(`${wk} ${d.toDateString()}: ${n} comidas`);
      }
    });
  });

  /* peso */
  t("weightTrend: −0,1 kg/día con 20 días de datos", () => {
    const wts = {}, keys = [];
    for (let i = 0; i < 20; i++) { const k = E(`iso(new Date(2026, 8, ${1 + i}, 12))`); wts[k] = 87 - 0.1 * i; keys.push(k); }
    const tr = w.weightTrend(wts, keys);
    near(tr.slope, -0.1, 0.001); near(tr.now, 85.1, 0.01);
  });
  t("weightTrend: sin datos suficientes no da tendencia", () => eq(w.weightTrend({ "2026-09-01": 87, "2026-09-02": 86.8 }, ["2026-09-01", "2026-09-02"]), null));

  t("Producto apuntado desde Google: se reconoce al escribirlo y da sus macros", () => {
    w.localStorage.setItem("menujd.products.v1", JSON.stringify([{ key: "utest", n: "Puré de verduras", nut: [81, 2, 12.5, 2.9] }]));
    E("parseCache.clear()");
    try {
      const m = w.ingMacros("300 g de Puré de verduras");
      near(m.k, 243, 0.5); near(m.p, 6, 0.01);
      eq(w.parseIng("300 g de pure de verduras").c.key, "utest", "sin tilde");
    } finally { w.localStorage.removeItem("menujd.products.v1"); E("parseCache.clear()"); }
  });

  /* bebidas y unidades */
  t("Bebidas: cada texto cae en su entrada (y el zumo de limón no es zumo)", () => {
    const cases = { "1 café con leche": "cafeleche", "1 cortado": "cafeleche", "1 café americano": "cafe", "330 ml de cerveza": "cerveza",
      "1 caña": "cerveza", "330 ml de cerveza sin alcohol": "cervezasin", "330 ml de coca-cola zero": "refresco", "150 ml de vino tinto": "vino",
      "200 ml de zumo de naranja": "zumo", "250 ml leche semi": "leche" };
    for (const [raw, key] of Object.entries(cases)) eq(w.parseIng(raw).c?.key, key, raw);
    if (w.parseIng("perejil fresco, zumo de limón y sal").c?.key === "zumo") throw new Error("zumo de limón cae en zumo");
  });
  t("Productos de los tickets de Mercadona: cada uno cae en su entrada", () => {
    const cases = { "Filetes de caballa del sur en aceite de oliva": "caballa", "Sardinillas en tomate": "sardinillas", "Jamoncitos de pollo": "jamoncitos",
      "Preparado de carne picada vacuno y cerdo": "picadamixta", "Preparado de carne picada pollo": "picada", "Caldo de pollo en pastillas": "caldo",
      "Cereales rellenos de leche": "cereales", "Cacao puro en polvo La Chocolatera": "cacao", "Chocolate negro 85% cacao": "chocolate",
      "Queso fresco cottage semidesnatado": "cottage", "Pasta fresca gnocchi": "gnocchi", "Macarrón Hacendado": "pasta", "Alubia cocida blanca": "alubias",
      "Postre lácteo con fruta 0% MG": "postrefruta", "Postre lácteo con fresa +Proteínas": "postre", "Gelatina 0% sabor cereza, cola y sandía": "gelatina",
      "Vinagre de vino blanco": "vinagre", "Cebolla en polvo": "especias", "Ajo granulado": "especias", "100 g de repollo": "col",
      "Coliflor, brócoli y zanahoria": "brocoli", "Espárragos blancos medianos": "esparragosblancos", "Mix frutas tropical": "frutatropical" };
    for (const [raw, key] of Object.entries(cases)) eq(w.parseIng(raw).c?.key, key, raw);
    eq(w.parseIng("salsa de soja baja en sal (10-15 ml, opcional)").c?.key, "soja", "soja con sal");
  });
  t("330 ml de cerveza ≈ 142 kcal; 1 café con leche ≈ 48 kcal", () => {
    near(w.ingMacros("330 ml de cerveza").k, 141.9, 0.5);
    near(w.ingMacros("1 café con leche").k, 48, 0.5);
  });
  t("Unidades: 228 g de muffins caseros (3 ud) = 3 muffins de 111 kcal", () => {
    const r = w.parseIng("228 g de muffins caseros (3 ud)");
    eq(r.c.key, "muffin"); near(r.qty, 3, 0.01); near(w.ingMacros(r.raw).k, 333, 1);
  });

  /* números */
  t("parseIng: unidades y gramos entre paréntesis", () => {
    near(w.parseIng("2 huevos L").grams, 120, 0.1);
    near(w.parseIng("1 lata de atún al natural (56 g)").grams, 56, 0.1);
  });

  /* ajuste de cantidades */
  t("fitMix: pollo + arroz + aceite para una comida de JD (750 kcal, 55 g P) cae en la franja", () => withProfile("jd", () => {
    const S = (k) => SHOP.find((c) => c.key === k);
    const items = [[S("pollo").cooked.nut, 120, S("pollo")], [S("arroz").cooked.nut, 200, S("arroz")], [S("aceite").nut, 10, S("aceite")]]
      .map(([nut, g0, c]) => ({ nut, g0, ...w.fitSpec(c, g0) }));
    const g = w.fitMix(items, { k: 750, p: 55, c: 80, f: 20 });
    const k = items.reduce((a, it, i) => a + it.nut[0] * g[i] / 100, 0), p = items.reduce((a, it, i) => a + it.nut[1] * g[i] / 100, 0);
    near(k, 750, 15, "kcal"); near(p, 55, 3, "proteína");
    if (g[2] % 1 !== 0 || g[0] % 5 !== 0) throw new Error("cantidades sin redondear: " + g.join(", "));
  }));
  t("withGrams conserva el texto y cambia solo la cantidad", () => {
    eq(w.withGrams("300 g pasta cocida (macarrón o hélices)", 250), "250 g pasta cocida (macarrón o hélices)");
    eq(w.withGrams("3 huevos L", 120), "2 huevos L");
    near(w.parseIng(w.withGrams("2 latas atún al natural (112 g)", 168)).grams, 168, 1);
  });
  t("Editor: al cambiar el pollo por merluza se recalculan las cantidades y el plato sigue en su franja", () => withProfile("jd", () => {
    const prevAuto = w.localStorage.getItem("menujd.autofit.v1"); w.localStorage.removeItem("menujd.autofit.v1");
    try {
      E('openEditor("C1")');
      const ed = E("ed"), idx = ed.i.findIndex((r) => /pollo/.test(r));
      const old = E(`ingMacros(ed.i[${idx}])`); ed.i[idx] = "130 g de merluza";
      ed.m = E(`addM(addM(ed.m, ${JSON.stringify(old)}, -1), ingMacros("130 g de merluza"))`);
      E("afterIngredientChange()");
      const m = E("ed.m");
      near(m.k, 750, 15, "kcal"); near(m.p, 55, 3, "proteína");
      eq(E("ed.justFit"), false, "se pinta y se limpia la marca"); // renderEditor la apaga tras pintarla
    } finally { E("closeSheet(); ed = null"); if (prevAuto != null) w.localStorage.setItem("menujd.autofit.v1", prevAuto); }
  }));
  t("Con lo que tengo: pollo cocido, arroz cocido y aceite para la comida → en la franja", () => withProfile("jd", () => {
    try {
      E('sheetState = { slot: "C", query: "", have: ["pollo|1", "arroz|1", "aceite|0"] }; computeFromPantry();');
      const m = E("ed.m");
      near(m.k, 750, 15, "kcal"); near(m.p, 55, 3, "proteína");
      eq(E("ed.i.length"), 3);
    } finally { E("closeSheet(); ed = null"); }
  }));

  t("Editor: cambiar la cantidad de un ingrediente la fija y el resto compensa", () => withProfile("jd", () => {
    const prevAuto = w.localStorage.getItem("menujd.autofit.v1"); w.localStorage.removeItem("menujd.autofit.v1");
    try {
      E('openEditor("C1")');
      const idx = E("ed.i.findIndex((r) => /pollo/.test(r))");
      E(`openQty(${idx})`);
      eq(E("ed.qtyOnly"), true);
      E("ed.grams = 140; applyPick()");
      eq(E(`ed.i[${idx}]`), "140 g pollo cocido", "se conserva la redacción");
      eq(E(`ed.locked.has(${idx})`), true, "queda fijada");
      // 140 g de pollo cocido aportan 12 g P más; sin compensar serían ~67 g P. El resto compensa hasta donde puede.
      const m = E("ed.m"); near(m.k, 750, 15, "kcal"); if (!(m.p < 61)) throw new Error("no compensa la proteína: " + m.p);
      E("ed.i.findIndex((r) => /aceite/.test(r))") >= 0 && E(`(() => { const ri = ed.i.findIndex((r) => /aceite/.test(r)); ed.m = addM(ed.m, ingMacros(ed.i[ri]), -1); ed.i.splice(ri, 1); ed.locked = new Set([...ed.locked].filter((x) => x !== ri).map((x) => (x > ri ? x - 1 : x))); })()`);
      eq(E("ed.i[[...ed.locked][0]]"), "140 g pollo cocido", "el fijado sigue apuntando al pollo tras quitar otro");
    } finally { E("closeSheet(); ed = null"); if (prevAuto != null) w.localStorage.setItem("menujd.autofit.v1", prevAuto); }
  }));
  t("Con lo que tengo: pasta, arroz y carne solo en cocinado", () => {
    E('sheetState = { slot: "C", query: "", have: [] }; openPantryPick();');
    const ids = [...w.document.querySelectorAll("#haveList [data-have]")].map((b) => b.dataset.have);
    for (const bad of ["pasta|0", "arroz|0", "pollo|0", "picada|0", "lomo|0", "noodles|0"]) if (ids.includes(bad)) throw new Error("sale en crudo: " + bad);
    for (const good of ["pasta|1", "arroz|1", "pollo|1", "picada|1", "lomo|1", "burger|1"]) if (!ids.includes(good)) throw new Error("falta cocinado: " + good);
    E("closeSheet()");
  });

  /* fotos */
  await ta("Cada entrada del catálogo tiene su foto (img/p/clave.webp) y sus créditos", async () => {
    const cr = await (await fetch("img/p/credits.json", { cache: "no-store" })).json();
    const bad = [];
    await Promise.all(SHOP.map(async (c) => {
      const r = await fetch(`img/p/${c.key}.webp`, { method: "HEAD", cache: "no-store" });
      if (!r.ok) bad.push(c.key + " (sin foto)");
      if (!cr[c.key] || !cr[c.key].l || !cr[c.key].u) bad.push(c.key + " (sin créditos)");
    }));
    eq(bad.length, 0, bad.join(", "));
  });

  await ta("Foto propia: se recorta al centro y se reduce a 160×160 JPEG", async () => {
    const cv = document.createElement("canvas"); cv.width = 600; cv.height = 300;
    const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
    const data = await w.shrinkPhoto(blob);
    eq(data.startsWith("data:image/jpeg"), true, "formato");
    const img = new Image(); await new Promise((r) => { img.onload = r; img.src = data; });
    eq(img.naturalWidth + "×" + img.naturalHeight, "160×160");
    if (data.length > 30000) throw new Error("demasiado grande: " + data.length);
  });

  /* Menú → Productos */
  t("Menú → Productos: añadir 2 manzanas a la merienda de un día (y se deja como estaba)", () => {
    const key = "2020-01-02", prevCur = E("iso(current)"), prevProfile = E("profile.id");
    E("profile = PROFILES.jd; rebuildIndex();");
    E(`current = new Date("${key}T12:00:00")`);
    try {
      E('setMenuTab("productos")');
      const d = w.document;
      if (!d.querySelector('[data-prod-add="manzana|0"] img.thumb')) throw new Error("la manzana no sale con foto en la lista");
      E('openProductSheet("manzana|0")');
      eq(E("sheetState.slot"), "D", "franja propuesta en un día que no es hoy");
      d.querySelector('[data-slot-pick="S"]').click();
      eq(d.getElementById("ffGo").textContent, "Añadir a Snack");
      d.querySelector('[data-u-set="2"]').click();
      d.getElementById("foodForm").requestSubmit();
      const it = E(`db["${key}"].items`);
      eq(it.length, 1); eq(it[0].slot, "S"); eq(it[0].i[0], "360 g de manzana (2 ud)"); near(it[0].k, 187.2, 0.5);
    } finally {
      E(`delete db["${key}"]; saveAll(db); current = new Date("${prevCur}T12:00:00"); closeSheet(); setMenuTab("platos");`);
      E(`profile = PROFILES.${prevProfile}; rebuildIndex(); renderHoy();`);
    }
  });

  /* comidas → Google Health (API simulada: no sale nada a internet) */
  {
    const prevProfile = E("profile.id"), realFetch = w.fetch, key = "2020-01-01";
    E("profile = PROFILES.jd; rebuildIndex();");
    const sentKey = E("foodSentKey()"), savedSent = w.localStorage.getItem(sentKey);
    const calls = [];
    let id = 0;
    w.fetch = async (url, opts = {}) => {
      const body = opts.body ? JSON.parse(opts.body) : null;
      calls.push({ url, body });
      return { ok: true, status: 200, json: async () => (/batchDelete/.test(url) ? { done: true } : { done: true, response: { name: `users/me/dataTypes/nutrition-log/dataPoints/p${++id}` } }) };
    };
    try {
      w.localStorage.removeItem(sentKey);
      E(`db["${key}"] = { type: "trabajo", items: [
        { slot: "D", n: "Tostadas", k: 500, p: 40, c: 50, f: 12 },
        { slot: "S", n: "Muffin", m: 2, k: 222, p: 19, c: 18.8, f: 7.6 },
        { slot: "S", n: "Postre", k: 54, p: 8.3, c: 5.4, f: 0.2 } ] };`);
      t("Comidas: un día con comidas y sin enviar está pendiente", () => eq(w.foodState(key), "pending"));
      await ta("Comidas: un envío crea una entrada por comida con sus macros y franja", async () => {
        const n = await w.sendFoodDay({ token: "x" }, key);
        eq(n, 3); eq(calls.length, 3);
        const log = calls[1].body.nutritionLog;
        eq(log.mealType, "SNACK"); eq(log.energy.kcal, 222); eq(log.foodDisplayName, "Muffin ×2");
        eq(log.nutrients[0].nutrient, "PROTEIN"); eq(log.nutrients[0].quantity.grams, 19); eq(log.totalFat.grams, 7.6);
        if (calls[1].body.nutritionLog.interval.startTime === calls[2].body.nutritionLog.interval.startTime) throw new Error("dos snacks a la misma hora");
        eq(w.foodState(key), "sent");
      });
      t("Comidas: cambiar algo tras enviarlo lo marca para actualizar", () => { E(`db["${key}"].items[0].k = 520`); eq(w.foodState(key), "changed"); });
      await ta("Comidas: reenviar borra las 3 entradas anteriores y crea las nuevas", async () => {
        calls.length = 0;
        await w.sendFoodDay({ token: "x" }, key);
        eq(calls[0].url.endsWith(":batchDelete"), true, "primero borra");
        eq(calls[0].body.names.join(","), "users/me/dataTypes/nutrition-log/dataPoints/p1,users/me/dataTypes/nutrition-log/dataPoints/p2,users/me/dataTypes/nutrition-log/dataPoints/p3");
        eq(calls.length, 4); eq(w.foodState(key), "sent");
      });
      await ta("Comidas: si falla a medias, se guarda lo creado para borrarlo en el siguiente intento", async () => {
        E(`db["${key}"].items[0].k = 530`);
        let n = 0;
        w.fetch = async (url) => (/batchDelete/.test(url) || ++n < 2
          ? { ok: true, status: 200, json: async () => ({ done: true, response: { name: "users/me/dataTypes/nutrition-log/dataPoints/q" + n } }) }
          : { ok: false, status: 500, json: async () => ({ error: { message: "boom" } }) });
        try { await w.sendFoodDay({ token: "x" }, key); throw new Error("no falló"); } catch (e) { if (e.message === "no falló") throw e; }
        eq(w.foodState(key), "changed");
        eq(E(`loadFoodSent().days["${key}"].names.length`), 1);
      });
    } finally {
      w.fetch = realFetch;
      E(`delete db["${key}"]`);
      if (savedSent != null) w.localStorage.setItem(sentKey, savedSent); else w.localStorage.removeItem(sentKey);
      E(`profile = PROFILES.${prevProfile}; rebuildIndex();`);
    }
  }

  /* hora real de las comidas y "Repetir" lo último de la franja */
  {
    const prevProfile = E("profile.id"), realFetch = w.fetch, prevCur = E("iso(current)"), sentKey = E("foodSentKey()");
    const savedSent = w.localStorage.getItem(sentKey), calls = [];
    E("profile = PROFILES.jd; rebuildIndex();");
    w.fetch = async (url, opts = {}) => { calls.push(JSON.parse(opts.body)); return { ok: true, status: 200, json: async () => ({ done: true, response: { name: "x" } }) }; };
    try {
      E(`db["2020-01-02"] = { type: "trabajo", items: [{ slot: "C", n: "Tarde", k: 700, p: 50, c: 70, f: 20, t: "16:05" }, { slot: "C", n: "Postre", k: 54, p: 8, c: 5, f: 0, t: "16:20" }] };`);
      await ta("Comidas: con hora registrada se envía a esa hora", async () => {
        await w.sendFoodDay({ token: "x" }, "2020-01-02");
        const hm = (c) => new Date(c.nutritionLog.interval.startTime).toTimeString().slice(0, 5);
        eq(hm(calls[0]), "16:05"); eq(hm(calls[1]), "16:20");
      });
      t("Hoy: se guarda la hora solo al registrar en el día de hoy", () => {
        E(`current = new Date(); current.setHours(12, 0, 0, 0); addItem("D", { n: "Prueba hora", k: 1, p: 0, c: 0, f: 0 });`);
        const x = E(`getDay(iso(new Date())).items.at(-1)`);
        eq(/^\d\d:\d\d$/.test(x.t), true, "hora " + x.t);
        E(`getDay(iso(new Date())).items.pop(); current = new Date("2020-01-03T12:00:00"); addItem("D", { n: "Sin hora", k: 1, p: 0, c: 0, f: 0 });`);
        eq(E(`db["2020-01-03"].items[0].t`), undefined);
      });
      t("Hoy: sin 3 repeticiones, se propone repetir lo último de la franja", () => {
        E(`db["2020-01-04"] = { type: "trabajo", items: [{ slot: "N", ref: "N4", m: 1, n: "x", k: 1, p: 1, c: 1, f: 1 }] };`);
        const f = E(`(() => { const r = favorite("N", "2020-01-05"); return r && { id: r.o.id, last: r.last }; })()`);
        eq(f && f.id, "N4"); eq(f.last, true);
      });
    } finally {
      w.fetch = realFetch;
      E(`["2020-01-02", "2020-01-03", "2020-01-04"].forEach((k) => delete db[k]); saveAll(db); current = new Date("${prevCur}T12:00:00");`);
      if (savedSent != null) w.localStorage.setItem(sentKey, savedSent); else w.localStorage.removeItem(sentKey);
      E(`profile = PROFILES.${prevProfile}; rebuildIndex(); renderHoy();`);
    }
  }

  for (const [k, v] of Object.entries(saved)) if (v != null) w.localStorage.setItem(k, v); else w.localStorage.removeItem(k);
  E("parseCache.clear()");
  document.getElementById("out").innerHTML = lines.join("\n");
  const h = document.getElementById("head");
  h.textContent = fail ? `✗ ${fail} fallos, ${pass} bien` : `✓ ${pass} tests bien`;
  h.className = fail ? "ko" : "ok";
  document.title = fail ? `FALLOS ${fail}` : `OK ${pass}`;
}
</script>
</body>
